[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pylemma"
version = "0.1.0"
description = "A small trust game with ten-round matches"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "logfire>=4,<5",
    "openai==2.29.0",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[openai]==1.107.0",
    "pydantic-monty>=1.4.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "hatchling==1.27.0",
    "mypy>=1.15,<2",
    "pytest>=8,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pylemma"]

[tool.hatch.build.targets.sdist]
include = ["src/pylemma", "tests", "pyproject.toml", "uv.lock", "README.md", "AGENTS.md", "SPEC.md", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
